    dialect: POSTGRES
    schema: kestra_unit_webserver

flyway:
  datasources:
    postgres:
      enabled: true
      locations:
        - classpath:migrations/postgres
      # We must ignore missing migrations as a V6 wrong migration was created and replaced by the V11
      ignore-migration-patterns: "*:missing,*:future"
      out-of-order: true
      properties:
        flyway:
          postgresql:
            transactional:
              lock: false

kestra:
  server:
    liveness:
      enabled: false
  repository:
    type: postgres
  queue:
    type: postgres
  secret:
